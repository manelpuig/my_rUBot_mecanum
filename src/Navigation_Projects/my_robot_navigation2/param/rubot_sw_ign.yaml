amcl:
  ros__parameters:
    use_sim_time: True
    set_initial_pose: true

    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
    # Frames and topics
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    global_frame_id: "map"
    scan_topic: /scan
    tf_broadcast: true
    transform_tolerance: 0.5

    # Mecanum / omni base model
    robot_model_type: "nav2_amcl::OmniMotionModel"

    # Odometry noise: higher values make AMCL trust odom less and lidar more.
    # Useful when mecanum wheels slip in Gazebo or real floor.
    alpha1: 0.4
    alpha2: 0.4
    alpha3: 0.4
    alpha4: 0.4
    alpha5: 0.4

    # Lidar model for a small 4x4 m world
    laser_model_type: "likelihood_field"
    laser_min_range: 0.05
    laser_max_range: 4.0
    laser_likelihood_max_dist: 1.0
    max_beams: 80
    sigma_hit: 0.15
    z_hit: 0.75
    z_short: 0.03
    z_max: 0.02
    z_rand: 0.20
    lambda_short: 0.1

    # Beam skipping disabled for a simple simulated lidar
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3

    # Particles: lighter than default but still robust for a 4x4 m map
    min_particles: 300
    max_particles: 1200
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1

    # More frequent correction from lidar
    update_min_d: 0.05
    update_min_a: 0.10

    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    save_pose_rate: 0.5

amcl_map_client:
  ros__parameters:
    use_sim_time: True

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    default_bt_xml_filename: "navigate_w_replanning_and_recovery.xml"
    bt_loop_duration: 100
    default_server_timeout: 1000
    wait_for_service_timeout: 3000
    enable_groot_monitoring: False
    groot_zmq_publisher_port: 1666
    groot_zmq_server_port: 1667
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_spin_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_goal_updater_node_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_distance_traveled_condition_bt_node
    - nav2_single_trigger_bt_node
    - nav2_is_battery_low_condition_bt_node
    - nav2_navigate_through_poses_action_bt_node
    - nav2_navigate_to_pose_action_bt_node
    - nav2_remove_passed_goals_action_bt_node
    - nav2_planner_selector_bt_node
    - nav2_controller_selector_bt_node
    - nav2_goal_checker_selector_bt_node

bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: True

controller_server:
  ros__parameters:
    use_sim_time: True
    cmd_vel_topic: "cmd_vel_nav"
    current_goal_checker: "general_goal_checker"

    # Lower frequency for lighter simulation
    controller_frequency: 3.0

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 1.0

    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.04
      movement_time_allowance: 15.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.40
      yaw_goal_tolerance: 0.78  # Approximately 45 degrees

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: False

      # Mecanum base: allow backward and lateral motion
      min_vel_x: -0.20
      max_vel_x: 0.35
      min_vel_y: -0.20
      max_vel_y: 0.2
      max_vel_theta: 1.6

      min_speed_xy: 0.0
      max_speed_xy: 0.40
      min_speed_theta: 0.10

      acc_lim_x: 2.0
      acc_lim_y: 2.0
      acc_lim_theta: 3.0
      decel_lim_x: -2.0
      decel_lim_y: -2.0
      decel_lim_theta: -3.0

      # Reduced samples to make DWB lighter
      vx_samples: 8
      vy_samples: 6
      vtheta_samples: 12
      sim_time: 1.0
      linear_granularity: 0.05
      angular_granularity: 0.05
      transform_tolerance: 0.3

      xy_goal_tolerance: 0.35
      trans_stopped_velocity: 0.30
      short_circuit_trajectory_evaluation: True
      stateful: True

      critics: ["Oscillation", "BaseObstacle", "PathDist", "GoalDist", "GoalAlign", "RotateToGoal"]

      BaseObstacle.scale: 0.4
      PathDist.scale: 4.0
      GoalDist.scale: 16.0
      GoalAlign.scale: 5.0
      GoalAlign.forward_point_distance: 0.12
      RotateToGoal.scale: 10.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

velocity_smoother:
  ros__parameters:
    use_sim_time: True

    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"

    max_velocity: [0.35, 0.20, 1.6]
    min_velocity: [-0.20, -0.20, -1.6]

    max_accel: [2.0, 2.0, 4.0]
    max_decel: [-2.0, -2.0, -4.0]

    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: True

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      global_frame: odom
      robot_base_frame: base_footprint

      # Lighter local costmap for a 4x4 m world with corridor
      update_frequency: 2.0
      publish_frequency: 1.0
      rolling_window: true
      width: 2
      height: 2
      resolution: 0.05

      # Adjust to the real footprint if needed. For narrow corridors, 0.18 is safer than 0.22.
      robot_radius: 0.18

      # LaserScan 2D: obstacle + inflation only. No voxel layer to reduce CPU.
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: True
          marking: True
          max_obstacle_height: 2.0
          raytrace_max_range: 2.5
          raytrace_min_range: 0.0
          obstacle_max_range: 2.0
          obstacle_min_range: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: True
        inflation_radius: 0.20
        cost_scaling_factor: 5.0

      always_send_full_costmap: False

  local_costmap_client:
    ros__parameters:
      use_sim_time: True

  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: True

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      global_frame: map
      robot_base_frame: base_footprint

      # Global map can be slower. Static 4x4 m map is cheap.
      update_frequency: 0.5
      publish_frequency: 0.5
      resolution: 0.07
      track_unknown_space: true
      robot_radius: 0.18

      # No voxel layer for 2D lidar
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        topic: /map

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: True
          marking: True
          max_obstacle_height: 2.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: True
        inflation_radius: 0.20
        cost_scaling_factor: 5.0

      always_send_full_costmap: False

  global_costmap_client:
    ros__parameters:
      use_sim_time: True

  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: True

map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: "map.yaml"

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    use_sim_time: True
    expected_planner_frequency: 0.5
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.25
      use_astar: false
      allow_unknown: true

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: True

behavior_server:
  ros__parameters:
    use_sim_time: True
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 2.0
    recovery_plugins: ["spin", "backup", "wait"]

    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"

    global_frame: odom
    robot_base_frame: base_footprint
    transform_timeout: 0.3
    simulate_ahead_time: 0.5
    max_rotational_vel: 0.8
    min_rotational_vel: 0.1
    rotational_acc_lim: 2.0

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200
