ekf_filter_node:
  ros__parameters:
    use_sim_time: true

    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true

    # IMPORTANT: publish TF odom->base_link
    publish_tf: true
    publish_acceleration: false

    # Frames
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # Input odometry
    odom0: /odom
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    # x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az
    odom0_config: [true,  true,  false,
                   false, false, true,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]