# ROS <-> Gazebo Sim bridge configuration for ros_gz_bridge/parameter_bridge
# IMPORTANT:
# - Adjust gz_topic_name once your gz_sim model publishes the corresponding topics.
# - For sensors / odom, gz topic names often include the model name, e.g.:
#   /model/<model_name>/odometry
#   /model/<model_name>/lidar/scan
# This file is intentionally "simple" and you will likely update it.

- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

- ros_topic_name: "/cmd_vel"
  gz_topic_name: "/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

# Odometry (Gazebo -> ROS)
- gz_topic_name: /model/rubot_mecanum/odometry
  gz_msg_type: gz.msgs.Odometry
  ros_topic_name: /odom
  ros_msg_type: nav_msgs/msg/Odometry
  direction: GZ_TO_ROS

- ros_topic_name: "/scan"
  gz_topic_name: "/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

# Camera (Gazebo -> ROS)
- gz_topic_name: /camera
  gz_msg_type: gz.msgs.Image
  ros_topic_name: /camera/image_raw
  ros_msg_type: sensor_msgs/msg/Image
  direction: GZ_TO_ROS

- gz_topic_name: /camera_info
  gz_msg_type: gz.msgs.CameraInfo
  ros_topic_name: /camera/camera_info
  ros_msg_type: sensor_msgs/msg/CameraInfo
  direction: GZ_TO_ROS